
#source_postgres (has data) → elt_script (moves it)  → destination_postgres  (receives it)
services: #docker will create 3 container source_postgres, destination_postgres and elt_script
  source_postgres:
    image: postgres:15
    ports:
      - '5433:5432' # PC port 5433 → container port 5432
    networks:
      - elt_network
    environment:
      POSTGRES_DB: source_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - ./source_db_init/init.sql:/docker-entrypoint-initdb.d/init.sql

  destination_postgres:
    image: postgres:15
    ports:
      - '5434:5432'
    networks:
      - elt_network
    environment:
      POSTGRES_DB: destination_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret

  # elt_script:
    # build:
      # context: ./elt # Directory containing the Dockerfile and elt_script.py
      # dockerfile: Dockerfile # Name of the Dockerfile, if it's something other than "Dockerfile", specify here
    # command: ['python', 'elt_script.py']
    # networks:
      # - elt_network
    # depends_on:
      # - source_postgres
      # - destination_postgres
  # dbt:
    # image: ghcr.io/dbt-labs/dbt-postgres:1.4.7
    # command:
      # [
        # "run",
        # "--profiles-dir",
        # "/root",
        # "--project-dir",
        # "/dbt"
      # ]
    # networks:
      # - elt_network
    # volumes:
      # - ./custom_postgres:/dbt
      # - ~/.dbt:/root
    # depends_on:
      # - elt_script
    # environment:
      # DBT_PROFILE: default
      # DBT_TARGET: dev

  postgres:
    image: postgres:latest
    networks:
     - elt_network
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
 #THIS INITILAIZE THE USER AND THE DATABASE THAT WE CREATED ALL TOGETHER FOR AIRFLOW
  init-airflow:
   image: apache/airflow:2.9.3
   depends_on:
     - postgres
   networks:
     - elt_network
   environment:
     - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
   command: >
     bash -c "airflow db migrate && airflow users create --username airflow --password password --firstname John --lastname Doe --role Admin --email adming@example.com"
            
#UI OF AIRFLOW
  webserver:
    build:
      context: .
      dockerfile: Dockerfile
    user: root
    depends_on:
      - postgres
    networks:
      - elt_network 
    extra_hosts:
     - "host.docker.internal:host-gateway"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./elt:/opt/airflow/elt
      - ./custom_postgres:/opt/dbt
      - ~/.dbt:/root/.dbt
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - LOAD_EX=n
      - EXECUTOR=Local
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=8g0lpNhrWScPEVXswxVkekV-UrZqsoSEGSrHcfUFplA=
      - AIRFLOW__WEBSERVER__DEFAULT__USER_USERNAME=airflow
      - AIRFLOW__WEBSERVER__DEFAULT__USER_PASSWORD=password
      - AIRFLOW_WWW_USER_USERNAME=airflow
      - AIRFLOW_WWW_USER_PASSWORD=password
      - AIRFLOW__WEBSERVER__SECRET_KEY=secret
      # - AIRFLOW__CORE__INTERNAL_API_URL=http://scheduler:8793
      # - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://scheduler:8793
    ports:
      - "8096:8080"
    command: webserver

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    user: root
    hostname: scheduler 
    depends_on:
      - postgres
    networks:
      - elt_network 
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./elt:/opt/airflow/elt
      - ./custom_postgres:/opt/dbt
      - ~/.dbt:/root/.dbt
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - LOAD_EX=n
      - EXECUTOR=Local
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=8g0lpNhrWScPEVXswxVkekV-UrZqsoSEGSrHcfUFplA=
      - AIRFLOW__WEBSERVER__DEFAULT__USER_USERNAME=airflow
      - AIRFLOW__WEBSERVER__DEFAULT__USER_PASSWORD=password
      - AIRFLOW_WWW_USER_USERNAME=airflow
      - AIRFLOW_WWW_USER_PASSWORD=password
      - AIRFLOW__WEBSERVER__SECRET_KEY=secret
      # - AIRFLOW__SCHEDULER__INTERNAL_API_HOST=scheduler
      # - AIRFLOW__CORE__INTERNAL_API_URL=http://scheduler:8793
      # - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://execution-api-server:8793
      # - AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK=True    
      # - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    # ports:
      # - "8086:8080"
    command: scheduler

    #ONE WEBSERVER IS NEEDED TO GIVE UI THE ACCESS AND ANOTHER TO SCHEDULE


networks:
  elt_network:
    driver: bridge